# ─────────────────────────────────────────────────────────────
#  GitHub Actions — Deploy to Netlify
#  Copy this file to: .github/workflows/netlify-deploy.yml
# ─────────────────────────────────────────────────────────────
#
#  Required GitHub Secrets (Settings → Secrets → Actions):
#    NETLIFY_AUTH_TOKEN  — Personal access token from Netlify
#    NETLIFY_SITE_ID     — Site ID from Netlify site settings
#
#  Required Netlify Environment Variables (Site → Environment):
#    NEXT_PUBLIC_SUPABASE_URL
#    NEXT_PUBLIC_SUPABASE_ANON_KEY
#    NEXT_PUBLIC_SITE_URL   (optional)

name: Deploy to Netlify

on:
  push:
    branches:
      - master
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: netlify-production
  cancel-in-progress: true

jobs:
  deploy:
    name: Build and deploy to Netlify
    runs-on: ubuntu-latest
    timeout-minutes: 20

    environment:
      name: production
      url: ${{ steps.deploy.outputs.deploy-url }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Copy netlify.toml from deploy folder to root
        run: cp deploy/netlify.toml netlify.toml

      - name: Deploy to Netlify
        id: deploy
        env:
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
          NETLIFY_SITE_ID:    ${{ secrets.NETLIFY_SITE_ID }}
        run: |
          npx --yes netlify-cli deploy \
            --build \
            --prod \
            --site  "$NETLIFY_SITE_ID" \
            --auth  "$NETLIFY_AUTH_TOKEN" \
            --json \
          | tee deploy-output.json
          echo "deploy-url=$(jq -r '.deploy_url' deploy-output.json)" >> "$GITHUB_OUTPUT"
