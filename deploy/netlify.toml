# ─────────────────────────────────────────────────────────────
#  Netlify configuration — RoziAteliyer (Next.js 13 / App Router)
#  Base directory: project root (one level above this file)
# ─────────────────────────────────────────────────────────────

[build]
  # Root of the Next.js project (relative to repo root)
  base    = "."
  command = "npm ci && npm run build"
  publish = ".next"

  [build.environment]
    NODE_VERSION = "20"
    NPM_FLAGS    = "--prefer-offline"

# ── Next.js runtime plugin (required for SSR / middleware) ────
[[plugins]]
  package = "@netlify/plugin-nextjs"

# ── Security & caching headers ────────────────────────────────
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options        = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy        = "strict-origin-when-cross-origin"
    Permissions-Policy     = "camera=(), microphone=(), geolocation=()"

[[headers]]
  for = "/_next/static/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/fonts/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# ── Redirects ─────────────────────────────────────────────────
# Redirect bare domain to fa locale (Next.js middleware also handles this,
# but a Netlify-level redirect avoids one extra round-trip)
[[redirects]]
  from   = "/"
  to     = "/fa"
  status = 302

# ── Environment variable placeholders ─────────────────────────
# Real values must be set in:
#   Netlify → Site → Environment variables
# Never commit real values here.
#
# [build.environment]
#   NEXT_PUBLIC_SUPABASE_URL      = "https://xxxx.supabase.co"
#   NEXT_PUBLIC_SUPABASE_ANON_KEY = "your-anon-key"
#   NEXT_PUBLIC_SITE_URL          = "https://your-site.netlify.app"
